<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team TAPIA | Smart Library Platform</title>
    <!-- Premium Fonts & Structural Icons -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --bg-canvas: #ffffff;
            --bg-panels: #f8fafc;
            --text-heading: #0f172a;
            --text-body: #475569;
            --accent-blue: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.08);
            --border-ui: #e2e8f0;
            --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
            --status-success: #10b981;
            --status-warning: #f59e0b;
            --transition-smooth: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-heading);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Hero Interactivity Layout with Custom Motion Effects */
        header {
            position: relative;
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.96)), 
                        url('https://unsplash.com') no-repeat center center/cover;
            padding: 4rem 2rem;
            border-bottom: 1px solid var(--border-ui);
            overflow: hidden;
        }

        .hero-container {
            max-width: 900px;
            z-index: 5;
            transform: translateY(20px);
            opacity: 0;
            animation: heroReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        header h1 {
            font-size: 5.5rem;
            font-weight: 800;
            letter-spacing: -3px;
            margin-bottom: 1.5rem;
            line-height: 1.1;
        }

        header h1 span {
            color: var(--accent-blue);
            display: inline-block;
            transition: transform 0.3s ease;
        }

        header h1 span:hover {
            transform: scale(1.05) rotate(-2deg);
        }

        header p {
            font-size: 1.4rem;
            color: var(--text-body);
            max-width: 720px;
            margin: 0 auto;
            font-weight: 400;
        }

        .main-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 2rem 6rem 2rem;
        }

        /* Advanced Motion Scroll Reveal Parameters */
        section {
            margin-bottom: 9rem;
            opacity: 0;
            transform: translateY(60px);
            transition: var(--transition-smooth);
        }

        section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .section-headline {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 3.5rem;
            position: relative;
            padding-bottom: 0.75rem;
        }

        .section-headline::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 60px;
            height: 4px;
            background: var(--accent-blue);
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        section:hover .section-headline::after {
            width: 100px;
        }

        /* Two-Column Strategic Overview Cards */
        .grid-split {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .info-card-panel {
            background-color: var(--bg-panels);
            border: 1px solid var(--border-ui);
            padding: 4rem 3.5rem;
            border-radius: 32px;
            box-shadow: var(--card-shadow);
            transition: var(--transition-smooth);
        }

        .info-card-panel:hover {
            transform: translateY(-5px);
            border-color: rgba(37, 99, 235, 0.2);
        }

        .info-card-panel p {
            font-size: 1.3rem;
            color: var(--text-body);
            font-weight: 400;
            line-height: 1.8;
        }

        .vivid-graphic-viewport {
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.08);
            height: 380px;
            position: relative;
        }

        .vivid-graphic-viewport img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .vivid-graphic-viewport:hover img {
            transform: scale(1.08);
        }

        /* Architecture Core Benefits Analysis Grid */
        .benefit-matrix {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2.5rem;
        }

        .benefit-node {
            background: var(--bg-canvas);
            border: 1px solid var(--border-ui);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            transition: var(--transition-smooth);
        }

        .benefit-node:hover {
            transform: translateY(-8px);
            border-color: var(--accent-blue);
            box-shadow: 0 30px 60px -15px rgba(37, 99, 235, 0.08);
        }

        .benefit-icon-box {
            width: 60px;
            height: 60px;
            background: var(--accent-glow);
            color: var(--accent-blue);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            transition: var(--transition-smooth);
        }

        .benefit-node:hover .benefit-icon-box {
            background: var(--accent-blue);
            color: white;
            transform: scale(1.1) rotate(5deg);
        }

        .benefit-node h3 {
            font-size: 1.4rem;
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        .benefit-node p {
            color: var(--text-body);
            font-size: 1rem;
        }

        /* Live Sandbox Display Platform */
        .sandbox-panel {
            background: var(--bg-panels);
            border: 1px solid var(--border-ui);
            border-radius: 32px;
            padding: 3.5rem;
            box-shadow: var(--card-shadow);
        }

        .search-engine-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .search-field {
            flex: 1;
            padding: 1.25rem 1.75rem;
            border: 1px solid var(--border-ui);
            border-radius: 18px;
            font-family: inherit;
            font-size: 1.05rem;
            outline: none;
            background-color: var(--bg-canvas);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-field:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 5px var(--accent-glow);
        }

        .inventory-list {
            display: grid;
            gap: 1.25rem;
        }

        .book-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2.5rem;
            border: 1px solid var(--border-ui);
            border-radius: 18px;
            background: var(--bg-canvas);
            transition: var(--transition-smooth);
        }

        .book-row:hover {
            transform: translateX(8px);
            border-color: rgba(37, 99, 235, 0.4);
            box-shadow: var(--card-shadow);
        }

        .book-details h4 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
        }

        .book-details p {
            font-size: 0.95rem;
            color: var(--text-body);
        }

        .tag-pill {
            padding: 0.5rem 1.25rem;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .pill-in { background: rgba(16, 185, 129, 0.1); color: var(--status-success); }
        .pill-out { background: rgba(245, 158, 11, 0.1); color: var(--status-warning); }

        /* Modern Grid Architecture for Rosters */
        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 3rem;
        }

        .profile-node {
            background: var(--bg-canvas);
            border: 1px solid var(--border-ui);
            border-radius: 32px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: var(--transition-smooth);
            transform-style: preserve-3d;
            transform: perspective(1000px);
        }

        .profile-node:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 30px 60px -15px rgba(37, 99, 235, 0.15);
        }

        .img-viewport {
            width: 100%;
            height: 270px;
            overflow: hidden;
            background: var(--bg-panels);
            position: relative;
        }
